version: "3.9"

services:
  # ===== Axum 应用服务 =====
  app:
    build: .
    ports:
      - "${SERVER_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # docker-compose 环境下用服务名连接数据库
      DATABASE_URL: mysql://root:root@db:3306/database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ===== MySQL 数据库 =====
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
