[workspace]
members = [
    "app",
    "bin",
    "bin/artisan",
    "common",
    "kernel",
    "database",
    "migration",
    "middleware"
]
resolver = "3"

[workspace.package]
authors = ["pengsy <songyang410@outlook.com>"]
edition = "2024"
homepage = "https://github.com/pengsy94"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
axum = "0.8.8"
anyhow = "1.0.100"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15.7"
num_cpus = "1.17.0"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = "1.48.0"
tower = "0.5.2"
tokio-cron-scheduler = "0.15.1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
thiserror = "2.0.17"
time = "0.3.44"
chrono = "0.4.42"
futures-util = "0.3.31"
uuid = "1.19.0"
sea-orm = "2.0.0-rc.24"
sea-orm-migration = "2.0.0-rc.24"
strum = "0.27.2"
http = "1.4.0"
validator = "0.20.0"
mime = "0.3.17"
utoipa = "5"
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "9"
argon2 = "0.5"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[profile.release]
debug = false
opt-level = 3

